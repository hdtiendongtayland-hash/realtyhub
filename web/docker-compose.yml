services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: al_demo_dongtayland_click:web
    container_name: al_demo_dongtayland_click_web
    ports:
      - "8826:8826"
    # .env tuy chon: server hien khong co (web dang chay du lieu mau)
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8826
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8826/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
